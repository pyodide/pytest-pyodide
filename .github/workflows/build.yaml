name: main

on:
  push:
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
      uses: ./.github/workflows/testall.yaml
      with:
        build-artifact-name: none
        build-artifact-path: none
        # 0.29.4 and 0.29.5 ship a broken coverage wheel (unresolved symbol
        # MyFrame_BorrowCode in tracer.so) which crashes run_in_pyodide_coverage,
        # so stay on 0.29.3 for the 0.29.x line.
        pyodide-versions: "314.0.7,0.29.3,0.28.3,0.27.8,0.26.4"

  deploy:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    environment: PyPi-deploy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: 3.13
      - name: Install requirements and build wheel
        shell: bash -l {0}
        run: |
          python -m pip install build twine
          python -m build .
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
